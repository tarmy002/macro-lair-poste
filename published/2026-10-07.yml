caption: |
  コメツキムシの仲間 — Elateridae

  ひっくり返っても、跳ねて起き上がります。

  コメツキムシは背中から落ちても、脚を使わずに戻れます。胸の下側にある突起を溝に引っかけ、力をためてから一気に外す。その反動で体が数センチ跳ね上がり、空中で回って着地する。指で挟むとパチンと鳴るので、米を搗く動きに見立てて名前が付きました。

  1枚目は、後翅を広げかけているところです。硬い上翅の下に、これだけの面積の翅が折り畳まれています。

  2枚目は別の個体。枯れた竹の上で、色も模様も完全に背景と同じでした。動かなければ、たぶん気づかずに通り過ぎています。

  日本のコメツキムシは数百種いて、外見がよく似ています。種までは追えていないので、科の名前で呼んでいます。

  - - - - -

  Turn one on its back and it will jump upright.

  A click beetle does not need its legs to right itself. A peg under the thorax catches in a groove; tension builds, then releases all at once. The snap throws the beetle several centimetres into the air, where it turns over and lands. Pinched between fingers it clicks — and the Japanese name likens that motion to pounding rice.

  The first frame catches one with a hindwing half-unfolded. All of that surface folds away under the hard forewings.

  The second is a different individual, on dead bamboo, matched to its background in both colour and pattern. Had it not moved, we would have walked straight past it.

  Japan has several hundred species and they look much alike. We have not taken this to species, so we are calling it by the family.

