caption: |
  ニホントカゲ — Plestiodon latiscutatus

  この青い尾、子どものあいだしか見られません。

  幼体の尾は、金属のように光る青。
  大人になるにつれて、この色は薄れていきます。

  なぜ子どもだけ青いのか。
  襲われたとき、目立つ尾に攻撃を集めるためと考えられています。
  尾は切り離しても、また生えてくる。
  いちばん失っていい場所を、いちばん目立たせている。

  1〜3枚目は夜の岩の上、4〜5枚目は昼。
  同じ青が、光でこれだけ変わります。

  子どものころ、青い尾のトカゲを追いかけたことはありますか？

  - - - - -

  You can only see this blue while it is young.

  A juvenile Japanese skink carries a tail that shines like blue metal.
  As it grows up, the colour slowly fades.

  Why only the young?
  The bright tail is thought to draw a predator's strike away from the body.
  The tail can be dropped, and it grows back.
  It advertises the one part it can afford to lose.

  The first three are at night on the rocks; the last two in daylight.
  Same blue, completely different light.

  Did you chase blue-tailed lizards as a kid?

