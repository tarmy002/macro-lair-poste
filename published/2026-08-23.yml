caption: |
  カナブン — Pseudotorynorrhina japonica

  道端にしゃがんで、こんなことをしています。

  カメラに付いている白い円錐は、ストロボの光をやわらげるためのものです。マクロでは、光源が被写体に対して大きいほど影がやわらかくなる。だから虫1匹を撮るのに、これくらい大げさな大きさになります。

  地面すれすれまで下げて、数センチの距離から覗き込む。ピントの合う幅は1ミリもありません。息を止めて、体ごと前後に動かして合わせます。

  そうしていたら、カナブンが土に潜りはじめました。後半は8倍速です。実際は36秒かけて、ゆっくり沈んでいきました。

  最後の1枚が、そのとき撮れた顔。平たく四角いシャベルのような頭楯が、カナブンの見分け方でもあります。

  - - - - -

  This is what it looks like from the outside.

  The white cone on the camera is a diffuser — it softens the flash. In macro, the larger the light source is relative to the subject, the softer the shadows. Which is why photographing a single beetle needs something this absurdly big.

  The lens goes down to ground level, a few centimetres from the subject. The band of sharp focus is under a millimetre. You hold your breath and rock your whole body to find it.

  While I was down there, the beetle started to bury itself. The second half runs at 8× speed — it actually took thirty-six seconds to sink out of sight.

  The last frame is the face I got that day. That flat, squared, shovel-like plate on the head is how you tell a kanabun from the others.

  📍 Shizuoka, Japan / Macro

