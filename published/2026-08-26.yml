caption: |
  カナブン — Pseudotorynorrhina japonica

  この平たい四角が、名前を決めています。

  頭の先に、シャベルのような板が付いているのが見えるでしょうか。頭楯といいます。カナブンはここが長方形で、縁が黒く立ち上がっている。

  よく似たハナムグリは、この板がもっと細くて中央がくぼみます。コガネムシの仲間は半円形。つまり、顔さえ見えれば名前が分かります。

  3枚目は、そのまま土に潜っていくところ。36秒かけて、ゆっくり沈んでいきました。花や樹液に来る虫という印象がありますが、土の中で幼虫時代を過ごすので、地面もまた彼らの居場所です。

  肉眼だと、金色の甲虫が飛んでいった、で終わります。近づいて初めて、顔があることに気づきます。

  - - - - -

  This flat, squared plate is what gives it its name.

  Look at the front of the head: a shovel-like shield called the clypeus. In a kanabun it is rectangular, with a raised black rim.

  The similar-looking flower chafers have a narrower plate, notched in the middle. Scarabs of the genus Anomala have a semicircular one. Which means that if you can see the face, you can name the beetle.

  The third frame is the same individual burying itself. It took thirty-six seconds to sink out of sight. We think of these as beetles of flowers and sap, but they spend their larval lives underground — the soil is their place too.

  From arm's length, this is just a gold beetle flying off. Only up close do you notice it has a face.

  保存しておくと、次に出会ったときに思い出せます。
  Save it so you remember this the next time you meet one.

  📍 Shizuoka, Japan / Macro

