caption: |
  マユタテアカネ — Sympetrum eroticum

  顔に、眉があります。

  1枚目の顔をよく見てください。複眼の下、黄色い額のところに黒い点が2つ並んでいます。これが「眉斑」。マユタテアカネという名前は、この眉を立てた顔から来ています。

  赤トンボと呼ばれる仲間は日本に何種もいて、慣れないと見分けがつきません。でもこの眉があるかどうかは、顔さえ撮れれば一発で分かります。

  もうひとつの決め手が、赤くなる範囲です。4枚目のとおり、この種は腹だけが真っ赤になって、胸は褐色のまま。全身が赤くなるショウジョウトンボとは、そこで分かれます。

  秋が深まるほど赤が濃くなります。いま出会ったこの個体も、あと一月もすれば別の色に見えるはずです。

  - - - - -

  This dragonfly has eyebrows.

  Look closely at the face in the first frame. Below the compound eyes, on the yellow forehead, sit two black dots. They are called the frontal spots — and they are what the Japanese name refers to: the darter with raised eyebrows.

  Japan has many species of red darter, and they are hard to tell apart until you know what to look for. But the presence of these two dots settles it instantly, as long as you can get the face.

  The second clue is how far the red reaches. As the fourth frame shows, only the abdomen turns scarlet here; the thorax stays brown. That is where it parts company with Crocothemis servilia, which reddens all over.

  The colour deepens as autumn goes on. This individual will look like a different insect in a month's time.

