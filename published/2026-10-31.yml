caption: |
  ヤクシマザル — Macaca fuscata yakui

  毛づくろいは、会話です。

  屋久島に暮らすヤクシマザルは、ニホンザルの亜種です。本州のニホンザルよりひと回り小さく、毛が濃いのが特徴です。

  母ザルの胸には、まだ小さな子ザル。春から初夏に生まれた子は、しばらく母親にしがみついて過ごします。

  2枚目と3枚目で、隣のサルが手を伸ばしているのは毛づくろいです。ノミ取りのように見えますが、群れの中で関係を保つための大切なやりとりでもあります。

  虫と爬虫類のアカウントですが、6月に屋久島で撮った写真を。今回はマクロではなく望遠です。

  - - - - -

  Grooming is a conversation.

  The macaques of Yakushima are a subspecies of the Japanese macaque — a little smaller than those on the mainland, with denser fur.

  Against the mother's chest is a small infant. Babies born in spring and early summer spend their first weeks clinging to their mothers.

  In the second and third frames, the monkey reaching over is grooming. It looks like flea-picking, but it is also how relationships are kept up within the troop.

  This account is mostly insects and reptiles, but here is something from Yakushima in June. Telephoto this time, not macro.

