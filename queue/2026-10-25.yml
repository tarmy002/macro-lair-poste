caption: |
  ササキリ（幼虫） — Conocephalus melaenus

  大人になると、緑になります。

  赤い頭に黒い体、長い触角。甲虫のようにも見えますが、これはキリギリスの仲間、ササキリの幼虫です。

  ササキリの成虫は、緑色の体に背中だけが黒っぽい、草むらに溶け込む色をしています。こんなに目立つ赤と黒をまとっているのは、幼虫のあいだだけです。

  キリギリスの仲間は蛹になりません。脱皮を繰り返して、少しずつ大人の姿に近づいていきます。この色も、脱皮のたびに変わっていきます。

  体よりずっと長い触角が、キリギリスの仲間である印です。

  - - - - -

  It turns green when it grows up.

  A red head, a black body and long antennae. It could pass for a beetle, but this is a young katydid — a nymph of Conocephalus melaenus.

  The adult is green, with a darker stripe down the back, coloured to disappear into the grass. The bold red and black is worn only while it is young.

  Katydids never pupate. They moult again and again, edging closer to the adult form, and the colours shift a little with every moult.

  Antennae far longer than the body are the mark of the katydid family.

