caption: |
  蛾の幼虫（種未同定）

  これが、毛虫の顔です。

  苔の上を歩いていた毛虫を、正面から撮りました。2枚目の網目模様の丸いものが頭。その下の赤茶色の部分が口で、葉をかじる大あごがここに収まっています。

  体を覆っているのは、白く長い毛と、背中に並ぶ橙色のブラシのような毛の束、前に突き出した黒い毛の房。こうしたブラシ状の毛束は、ドクガの仲間の幼虫によく見られる形です。

  ただ、種までは分かっていません。毛虫は種類が多く、同じ種でも成長の段階で姿が変わります。断定できないものには名前を付けない、というのがこのアカウントの決まりなので、「蛾の幼虫」としています。分かる方がいたら教えてください。

  触れると皮膚がかぶれる毛虫もいます。種が分からないものは、素手で触らないのが安全です。

  - - - - -

  This is what a caterpillar's face looks like.

  It was walking across moss, and I photographed it head-on. The round, net-patterned shape in the second frame is the head. The reddish-brown part beneath it is the mouth, where the jaws for chewing leaves sit.

  The body is covered in long white hairs, a row of orange brush-like tufts along the back, and black plumes reaching forward. Tufts like these are typical of tussock moth caterpillars.

  But I have not identified the species. There are a great many caterpillars, and one species can change its look as it grows. Not naming what I cannot confirm is a rule this account keeps, so it stays "a moth caterpillar" for now. If you know it, please tell me.

  Some caterpillars cause skin rashes on contact. If you do not know the species, do not touch it with bare hands.

