caption: |
  シオヤアブ — Promachus yesonicus

  尻の白い毛は、オスの印です。

  腹の先に、筆先のような白い毛束が付いています。これがあるのはオスだけ。シオヤアブという名前も、この塩をまぶしたような白さから来ていると言われます。

  抱えているのはミツバチです。シオヤアブは飛んでいる虫を空中で捕らえ、六本の脚で抱え込んで、太い口吻を差し込みます。相手を選ばず、自分と同じくらいの大きさの虫でも襲います。

  捕らえた獲物はその場では食べません。どこかに止まって、時間をかけて中身を吸う。この個体も手すりの上から動きませんでした。よく見ると、ミツバチの脚には花粉らしい黄色がまだ残っています。

  肉眼では、大きなアブが何かを抱えている、で終わります。近づいて初めて、抱えられている側が誰なのか分かります。

  - - - - -

  The white tuft is how you know it is a male.

  At the tip of the abdomen sits a brush of white hair. Only males have it, and the Japanese name — roughly "salt seller" — is said to come from that dusted-with-salt look.

  What it is holding is a honeybee. This robber fly takes insects in mid-air, wraps them in all six legs, and drives in its heavy proboscis. It is not fussy about size; prey as large as itself is fair game.

  It does not eat where it catches. It finds a perch and drains the body slowly. This one stayed on the railing without moving. Look closely and there is still a trace of yellow on the bee's leg — pollen, most likely.

  From a few steps away this is just a big fly holding something. Only up close do you find out who is being held.

