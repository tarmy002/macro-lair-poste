caption: |
  ミヤマアカネ — Sympetrum pedemontanum elatum

  翅に帯があるのは、この種だけです。

  前回のマユタテアカネは、顔の眉で見分けました。今度はもっと簡単です。四枚の翅の先近くに、太い褐色の帯が入っている。日本の赤とんぼ（アカネ属）でこの帯を持つのはミヤマアカネだけなので、飛んでいる姿でも分かります。

  帯の外側にある小さな四角は、縁紋といいます。この個体は白っぽいですが、成熟したオスでは赤くなる。つまり縁紋の色を見れば、その個体がどのくらい歳を重ねたかが読めます。

  「ミヤマ」と付きますが、深い山にいるわけではありません。田んぼの脇や、里の水辺にふつうにいます。名前に引きずられて探す場所を間違えると、かえって会えない虫です。

  - - - - -

  Only this species has bands on its wings.

  Last time, the darter was identified by the eyebrows on its face. This one is easier. Near the tip of each of the four wings runs a broad brown band. No other red darter in Japan carries it, which means you can name this one in flight.

  The small rectangle beyond the band is the pterostigma. On this individual it is pale; on a mature male it turns red. So the colour of that one small cell tells you roughly how far along in life the dragonfly is.

  The Japanese name begins with "deep mountain", but it lives nowhere so remote — the edges of rice paddies and ordinary village water are where you find it. Take the name literally and you will look in the wrong place.

