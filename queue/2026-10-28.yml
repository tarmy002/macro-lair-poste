caption: |
  サワガニ — Geothelphusa dehaani

  一生を、川で過ごすカニです。

  多くのカニは、卵から小さな幼生が生まれ、海を漂いながら育ちます。サワガニは違います。卵の中で育ちきり、生まれたときにはもうカニの形をしている。母ガニは、その子ガニたちをお腹に抱えて守ります。

  だから海に下りる必要がなく、一生を川の上流や沢の近くで過ごせます。日本にしかいない、固有のカニです。

  赤い脚と、暗い色の甲羅。サワガニの色は地域によって違い、青っぽい個体や白っぽい個体が見られる場所もあります。この個体は、落ち葉の上にいました。

  - - - - -

  A crab that spends its whole life in fresh water.

  Most crabs hatch as tiny larvae that drift in the sea while they grow. This one does not. It develops fully inside the egg and hatches already shaped like a crab, and the mother carries her young tucked under her abdomen.

  So it never needs to go down to the sea, and it can live out its life in headwaters and streams. It is found only in Japan.

  Red legs and a dark shell. The colour varies from region to region, and in some places the crabs are bluish or pale. This one was sitting on fallen leaves.

