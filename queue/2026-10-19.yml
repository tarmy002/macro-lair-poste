caption: |
  ニジュウヤホシテントウ — Henosepilachna vigintioctopunctata

  葉を食べるテントウムシです。

  テントウムシといえば、アブラムシを食べてくれる虫という印象があります。でもこの仲間は違います。食べるのはナス科の植物の葉。ナスやジャガイモの畑では、害虫として扱われています。

  1枚目の葉の穴も、2枚目のレースのような跡も、このテントウの食べ跡です。葉の表面を削るように食べて、葉脈だけを残していく。3枚目は、まさに食べている最中です。

  背中の黒い点は28個。「ニジュウヤホシ」という名前はここから来ています。ナナホシテントウのようなつやはなく、細かい毛に覆われているので、表面がマットに見えます。

  - - - - -

  A ladybird that eats leaves.

  Ladybirds are usually the gardener's friend, eating aphids. This group is the exception. It feeds on the leaves of the nightshade family, and in eggplant and potato fields it is treated as a pest.

  The holes in the first frame and the lace-like pattern in the second are both its feeding marks. It scrapes away the leaf surface and leaves the veins behind. The third frame catches it mid-meal.

  Twenty-eight black spots give it its Japanese name, "twenty-eight stars". Instead of the glossy shell of a seven-spot ladybird, its back is covered in fine hairs, which is why it looks matte.

