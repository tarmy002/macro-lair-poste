caption: |
  アシマダラアカサシガメ — Haematoloecha rubescens

  脚を見れば、決まります。

  赤と黒のサシガメには、よく似た2種がいます。アカシマサシガメと、アシマダラアカサシガメ。翅の斑も腹の縞も、ぱっと見では区別がつきません。

  分かれるのは脚です。アカシマサシガメは脚が全体に黒い。この個体は腿節が赤くて、その先が黒い。まだらになった脚、それが「アシマダラ」という名前の由来です。

  頭の下から前へ伸びている黒い針が、口です。サシガメはこれを獲物に突き刺し、消化液を送り込んで、溶けた中身を吸います。噛むのではなく、刺して吸う。

  3枚目がその最中。相手はヤスデです。ヤスデは襲われると体を巻き、体側の孔から防御物質を出します。たいていの捕食者はこれで退きます。この仲間は、それを専門に食べる一群です。避けられている相手を、わざわざ選んで襲いにいく。

  体長11〜14mm。素手で扱うと刺されることがあるので、見つけても触らないのが正解です。

  - - - - -

  The legs settle it.

  Japan has two red-and-black assassin bugs that look much alike: Haematoloecha nigrorufa and H. rubescens. The blotches on the wings and the banding along the abdomen will not separate them at a glance.

  The legs will. In nigrorufa they are black throughout. Here the femora are red and only the ends are black — and that mottled leg is exactly what the Japanese name refers to.

  The black needle running forward from under the head is the mouth. An assassin bug drives this rostrum into its prey, injects digestive fluid, and drinks what dissolves. It does not chew; it stabs and sucks.

  The third frame is that, in progress. The prey is a millipede. Millipedes coil when attacked and release defensive chemicals from pores along the flank, and most predators give up. This group specialises in them — it goes looking for exactly what everything else avoids.

  Eleven to fourteen millimetres. Handled bare-handed they can stab back, so look and do not touch.

