caption: |
  ヘビの抜け殻

  これ、裏返しです。

  ヘビは口の先から皮をめくり、靴下を脱ぐように体をくぐらせて脱ぎます。だから抜け殻は内側が外を向いている。いま見えている鱗の並びは、生きているヘビの表面ではなく、その裏側です。

  目の部分も一緒に脱げます。ヘビにはまぶたがなく、代わりに透明な鱗が目を覆っていて、それも皮の一部だからです。

  鱗を数えると種が分かります。胴を一周する列の数が、種ごとにほぼ決まっている。ただしこの状態では一周を数えられないので、名前は出しません。数えられないものに名前を付けない、というのはこのアカウントの決まりです。

  1枚目は林床、2枚目は苔むした岩の上。どちらも落ちていたままの場所で撮りました。深度合成です。ピント位置を少しずつ変えた20枚から、合っている部分だけを重ねています。

  - - - - -

  This is inside out.

  A snake sheds by peeling the skin back from its lips and crawling out of it, the way you pull off a sock. The shed ends up reversed — so the pattern of scales you are looking at is not the snake's outer surface. It is the underside of it.

  The eyes come off with it. Snakes have no eyelids; a clear scale covers each eye, and that scale is part of the skin.

  Count the scales and you can name the species — the number of rows around the body is close to fixed for each one. But a full circuit cannot be counted here, so we are not giving a name. Not naming what we cannot count is a rule we keep.

  The first frame is on the forest floor, the second on a mossy rock; both were photographed where they lay. Focus-stacked from twenty frames, combining only the parts that were sharp.

  🦎 爬虫類の撮影、静岡のスタジオで受け付けています。プロフィールのDMから。
